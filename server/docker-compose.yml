name: convergencia

services:
  server:
    build:
      context: ..
      dockerfile: server/Dockerfile
    env_file:
      - .env
    environment:
      HOST: 0.0.0.0
      PORT: "3001"
      DATABASE_URL: file:/data/convergencia.db
      UPLOADS_DIR: /data/uploads
    volumes:
      - convergencia-data:/data
    restart: unless-stopped

  caddy:
    image: caddy:2
    depends_on:
      - server
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    restart: unless-stopped

volumes:
  convergencia-data:
  caddy-data:
  caddy-config:
